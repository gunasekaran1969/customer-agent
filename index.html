<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Help Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#eef2f1;height:100dvh;display:flex;justify-content:center}
main{width:100%;max-width:520px;display:flex;flex-direction:column;background:#fff}
header{padding:16px;background:#14532d;color:#fff;font-weight:600}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:82%;padding:10px 14px;border-radius:16px;line-height:1.4;white-space:pre-wrap}
.bot{background:#e8f0ec;align-self:flex-start}
.me{background:#14532d;color:#fff;align-self:flex-end}
#bar{display:flex;gap:8px;padding:12px;border-top:1px solid #ddd}
input{flex:1;padding:12px;border:1px solid #bbb;border-radius:10px;font-size:16px}
button{padding:12px 18px;border:0;border-radius:10px;background:#14532d;color:#fff;font-size:16px}
button:disabled{opacity:.5}
</style></head>
<body><main>
<header>Ask us anything</header>
<div id="log"><div class="m bot">Hi! How can I help you today?</div></div>
<div id="bar"><input id="q" placeholder="Type your question" autocomplete="off"><button id="go">Send</button></div>
</main>
<script>
const log=document.getElementById("log"),q=document.getElementById("q"),go=document.getElementById("go");
const history=[];
function add(t,c){const d=document.createElement("div");d.className="m "+c;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function send(){
  const t=q.value.trim(); if(!t)return;
  q.value=""; add(t,"me"); history.push({role:"user",content:t});
  go.disabled=true; const w=add("Typing...","bot");
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages:history})});
    const d=await r.json(); w.textContent=d.reply; history.push({role:"assistant",content:d.reply});
  }catch(e){w.textContent="Connection problem. Please try again."}
  go.disabled=false; q.focus();
}
go.onclick=send; q.onkeydown=e=>{if(e.key==="Enter")send()};
</script></body></html>
